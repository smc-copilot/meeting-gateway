[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeskclaw-meeting"
version = "1.0.0rc1"
description = "Tencent Meeting application, REST and MCP permission gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
 "fastapi==0.128.2", "uvicorn[standard]>=0.32,<1", "sqlalchemy[asyncio]==2.0.50",
 "asyncpg>=0.30,<1", "pydantic==2.13.5", "pydantic-settings==2.14.1",
 "httpx==0.28.1", "aiohttp==3.13.3", "cryptography==46.0.4",
 "alembic==1.18.4", "python-multipart==0.0.29",
]
[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0", "ruff>=0.8,<1", "mcp>=1.23,<2"]
[project.scripts]
meeting-worker = "app.worker:main"
meeting-admin = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "storage*", "integration*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_POSTGRES_URL", "sdk: requires optional MCP SDK", "live: explicitly opted-in Tencent tenant verification"]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
