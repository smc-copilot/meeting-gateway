name: nodeskclaw-meeting
x-meeting: &meeting
  build:
    context: ..
    platforms: [linux/amd64]
  image: nodeskclaw-meeting:1.0.0rc1
  platform: linux/amd64
  env_file: ../.env
  volumes: [meeting-private:/data]
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_DB: meeting
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate private .env first}
    volumes: [meeting-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *meeting
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *meeting
    ports: ["127.0.0.1:4522:8000"]
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    <<: *meeting
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  meeting-pg:
  meeting-private:
